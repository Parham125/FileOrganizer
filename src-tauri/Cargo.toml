[package]
name = "fileorganizer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FileOrganizer desktop app"

[lib]
name = "fileorganizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
fo-indexer.workspace = true
fo-hasher.workspace = true
fo-dedup.workspace = true
fo-search.workspace = true
fo-trash.workspace = true
fo-ai.workspace = true
fo-extract.workspace = true
fo-rules.workspace = true
fo-chats.workspace = true
fo-archive.workspace = true
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
tempfile = "3"
