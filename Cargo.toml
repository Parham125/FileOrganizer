[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fo-indexer = { path = "crates/indexer" }
fo-hasher = { path = "crates/hasher" }
fo-dedup = { path = "crates/dedup" }
fo-search = { path = "crates/search" }
fo-trash = { path = "crates/trash" }
fo-ai = { path = "crates/ai" }
fo-extract = { path = "crates/extract" }
fo-rules = { path = "crates/rules" }
fo-chats = { path = "crates/chats" }
